[Interface]
PrivateKey = <SERVER_PRIVATE_KEY_HERE>
Address = 10.10.0.1/24
ListenPort = 51820

PreUp = sysctl -w net.ipv4.ip_forward=1
PostUp = iptables -t nat -A PREROUTING -p tcp --dport 80 -j DNAT --to-destination 10.10.0.2:80
PostUp = iptables -t nat -A PREROUTING -p tcp --dport 443 -j DNAT --to-destination 10.10.0.2:443
PostUp = iptables -t nat -A POSTROUTING -j MASQUERADE

PreDown = iptables -t nat -D PREROUTING -p tcp --dport 80 -j DNAT --to-destination 10.10.0.2:80
PreDown = iptables -t nat -D PREROUTING -p tcp --dport 443 -j DNAT --to-destination 10.10.0.2:443
PreDown = iptables -t nat -D POSTROUTING -j MASQUERADE

[Peer]
PublicKey = <CLUSTER_PUBLIC_KEY_HERE>
AllowedIPs = 10.10.0.2/32
#Endpoint = <CLUSTER_PUBLIC_IP>:51820
